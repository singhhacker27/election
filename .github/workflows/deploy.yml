name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: election-495120
  REGION: asia-south1

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Backend
        run: |
          gcloud builds submit ./backend \
            --tag gcr.io/${{ env.PROJECT_ID }}/election-backend

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy election-backend \
            --image gcr.io/${{ env.PROJECT_ID }}/election-backend \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars="ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Frontend
        run: |
          gcloud builds submit ./frontend \
            --tag gcr.io/${{ env.PROJECT_ID }}/election-frontend

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy election-frontend \
            --image gcr.io/${{ env.PROJECT_ID }}/election-frontend \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated
