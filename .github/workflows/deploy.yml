name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: election-495120
  REGION: asia-south1

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Deploy Backend'
        run: |
          cd backend
          gcloud builds submit --tag gcr.io/${{ env.PROJECT_ID }}/voteiq-backend
          gcloud run deploy voteiq-backend \
            --image gcr.io/${{ env.PROJECT_ID }}/voteiq-backend \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Deploy Frontend'
        run: |
          cd frontend
          # You might need to set the backend URL here
          # VITE_API_URL=$(gcloud run services describe voteiq-backend --region ${{ env.REGION }} --format 'value(status.url)')
          gcloud builds submit --tag gcr.io/${{ env.PROJECT_ID }}/voteiq-frontend
          gcloud run deploy voteiq-frontend \
            --image gcr.io/${{ env.PROJECT_ID }}/voteiq-frontend \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated
